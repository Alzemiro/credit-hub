// Módulo executável: liga tudo e sobe o Spring Boot.
apply plugin: 'org.springframework.boot'

dependencies {
    implementation project(':credit-hub-domain')
    implementation project(':credit-hub-application')
    implementation project(':credit-hub-adapter')

    implementation 'org.springframework.boot:spring-boot-starter'

    // Tracing: exporta spans via OTLP p/ Jaeger. Versões pelo BOM do Boot (não pinar).
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Propaga o trace-context às virtual threads do scatter-gather (executor context-aware
    // montado em UseCaseConfig; mantém o módulo application framework-free).
    implementation 'io.micrometer:context-propagation'
}
