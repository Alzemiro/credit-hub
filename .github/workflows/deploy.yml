name: Build and Deploy to ACA

on:
  # Disparo manual pela aba Actions (botao "Run workflow").
  workflow_dispatch:
  # Push na main so builda quando muda codigo/workflow; docs (README etc.) nao disparam.
  push:
    branches:
      - main
    paths:
      - 'credit-hub-**'
      - 'audit-service/**'
      - 'decision-consumer/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Build and Test
        run: |
          chmod +x gradlew
          ./gradlew build -x :decision-consumer:test

  docker-build-push-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR name and login
        run: |
          # O nome do ACR tem sufixo aleatorio (random_string no TF), entao descobrimos
          # pelo resource group em vez de depender de um secret fixo que quebra a cada
          # recriacao. $ACR fica disponivel nos steps seguintes via GITHUB_ENV.
          ACR_NAME=$(az acr list -g ${{ secrets.AZURE_RG_NAME }} --query "[0].name" -o tsv)
          echo "ACR=$ACR_NAME.azurecr.io" >> $GITHUB_ENV
          az acr login --name $ACR_NAME

      - name: Build and Push Docker Images
        run: |
          TAG=${GITHUB_SHA}
          chmod +x gradlew
          
          # Using spring-boot plugin to build OCI images
          ./gradlew :credit-hub-bootstrap:bootBuildImage --imageName=$ACR/credit-query-service:$TAG
          docker push $ACR/credit-query-service:$TAG
          
          ./gradlew :audit-service:bootBuildImage --imageName=$ACR/audit-service:$TAG
          docker push $ACR/audit-service:$TAG
          
          ./gradlew :decision-consumer:bootBuildImage --imageName=$ACR/decision-consumer:$TAG
          docker push $ACR/decision-consumer:$TAG

      - name: Deploy to Azure Container Apps
        run: |
          TAG=${GITHUB_SHA}
          RG=${{ secrets.AZURE_RG_NAME }}
          UAI=$(az identity show -n credithub-aca-identity -g $RG --query id -o tsv)

          # Configura o pull do ACR via UAI. Feito aqui (nao no Terraform) porque o create do
          # ACA falha com IdentityDoesNotExist se registry.identity for validado antes da UAI
          # ser associada. No update o app ja existe e a UAI ja esta associada -> sem o bug.
          for APP in credithub-query-service credithub-audit credithub-decision; do
            az containerapp registry set --name $APP --resource-group $RG --server $ACR --identity "$UAI"
          done

          az containerapp update --name credithub-query-service --resource-group $RG --image $ACR/credit-query-service:$TAG
          az containerapp update --name credithub-audit --resource-group $RG --image $ACR/audit-service:$TAG
          az containerapp update --name credithub-decision --resource-group $RG --image $ACR/decision-consumer:$TAG
